name: Server CI

# `contract/**` is in the filter because the server typechecks against it: a
# change there can break this build while touching nothing under `server/`, and
# a path filter that misses that turns a compile error into a merged one.
# The lockfile and workspace file are here for the same reason - both now live
# at the root and both change what gets installed.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'contract/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'contract/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: 'server/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      # Run from `server/`, but pnpm walks up to `pnpm-workspace.yaml` and
      # installs every project - including `web/`, whose dependencies this job
      # never uses. Deliberate: `--filter` would install a different tree from
      # the one a developer has, and the difference is exactly the kind of thing
      # that only shows up as a CI-only failure. The extra time is seconds.
      - run: pnpm install --frozen-lockfile

      # The audit worker drives real Chromium, so CI needs the browser. Cached
      # on the resolved Playwright version: the browser build is tied to it, so
      # a version bump must miss the cache rather than reuse a stale binary.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm typecheck
      # Build BEFORE test: a spec asserts the vendored axe engine reached
      # dist/, which tsc does not copy on its own. Testing first would make
      # that assertion vacuous.
      - run: pnpm build
      - run: pnpm test
