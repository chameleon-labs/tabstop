name: Server CI

# `contract/**` is in the filter because the server typechecks against it: a
# change there can break this build while touching nothing under `server/`, and
# a path filter that misses that turns a compile error into a merged one.
#
# The root `package.json`, lockfile and workspace file are here for the same
# reason. The root manifest is where `packageManager` now lives, so
# `pnpm/action-setup` reads its pnpm version from it - a bump there changes what
# this job runs with while touching nothing under `server/`.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'contract/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/server-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'server/.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      # Run from `server/`, but pnpm walks up to `pnpm-workspace.yaml` and
      # installs every project, including `web/`. Deliberate, and not for the
      # reason first written here: pnpm gives each package a `node_modules`
      # holding only its own declared dependencies, so `--filter` produces a
      # byte-identical tree for `server/` - that was checked rather than
      # assumed. What the full install actually buys is that `--frozen-lockfile`
      # verifies the lockfile against every project, so a lockfile left stale
      # for `web/` fails here instead of only in the other workflow.
      - run: pnpm install --frozen-lockfile

      # The audit worker drives real Chromium, so CI needs the browser. Cached
      # on the resolved Playwright version: the browser build is tied to it, so
      # a version bump must miss the cache rather than reuse a stale binary.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - run: pnpm typecheck
      # Build BEFORE test: a spec asserts the vendored axe engine reached
      # dist/, which tsc does not copy on its own. Testing first would make
      # that assertion vacuous.
      - run: pnpm build
      - run: pnpm test
