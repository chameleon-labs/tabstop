services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tabstop
      POSTGRES_PASSWORD: tabstop
      POSTGRES_DB: tabstop
    ports:
      - '5432:5432'
    volumes:
      - tabstop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tabstop -d tabstop']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tabstop-pgdata:
